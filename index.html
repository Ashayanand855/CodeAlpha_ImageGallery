<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">Image GALLERY</div>
        <nav class="menu-links">
            <a href="#" class="active">Portfolio</a>
            <a href="#">Collections</a>
            <a href="#">Exhibitions</a>
            <a href="#">About</a>
        </nav>
        <div class="menu-actions">
            <button class="main-button">Contact</button>
        </div>
    </header>

    <div class="container">
        <nav class="filters">
            <button class="filter-button active" data-filter="all">All</button>
            <button class="filter-button" data-filter="nature">Nature</button>
            <button class="filter-button" data-filter="architecture">Architecture</button>
            <button class="filter-button" data-filter="urban">Urban</button>
            <button class="filter-button" data-filter="minimal">Minimal</button>
            <button class="filter-button" data-filter="abstract">Abstract</button>
            <button class="filter-button" data-filter="portrait">Portrait</button>
        </nav>

        <main class="gallery">
            <div class="image-card tall-card" data-category="architecture" data-index="0">
                <img src="#" alt="Architecture">
                <div class="hover-overlay">
                    <div class="image-title">Concrete Sky</div>
                    <div class="image-category">Architecture</div>
                </div>
            </div>
            <div class="image-card square-card" data-category="nature" data-index="1">
                <img src="#" alt="Nature">
                <div class="hover-overlay">
                    <div class="image-title">Winter Solitude</div>
                    <div class="image-category">Nature</div>
                </div>
            </div>
            <div class="image-card tall-card" data-category="urban" data-index="2">
                <img src="#" alt="Urban">
                <div class="hover-overlay">
                    <div class="image-title">Night Spotlight</div>
                    <div class="image-category">Urban</div>
                </div>
            </div>
            <div class="image-card tall-card" data-category="minimal" data-index="3">
                <img src="#" alt="Minimal">
                <div class="hover-overlay">
                    <div class="image-title">Soft Interior</div>
                    <div class="image-category">Minimal</div>
                </div>
            </div>
        </main>
    </div>

    <div class="image-popup" id="image-popup">
        <button class="popup-button close-popup" id="close-popup">
            <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
        
        <div class="popup-content">
            <img src="#" alt="Popup Image" class="popup-image" id="popup-image">
        </div>

        <div class="popup-controls" id="popup-controls">
            <button class="popup-button prev-image" id="prev-image">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></svg>
            </button>
            <button class="popup-button next-image" id="next-image">
                <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
